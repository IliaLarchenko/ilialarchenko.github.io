<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found · Ilia Larchenko</title>
  <!-- GitHub Pages serves this file (with HTTP 404) for every missing path. After 10 s it goes to the home page. -->
  <meta http-equiv="refresh" content="10; url=/">
  <style>
    :root { --bg: #FAFAFA; --fg: #111111; --fg2: #555555; --fg3: #8A8A8A; --acc: #E94B1F; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111111; --fg: #F2F2F2; --fg2: #B0B0B0; --fg3: #808080; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
           background: var(--bg); color: var(--fg); font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; }
    main { max-width: 560px; }
    .k { font-size: 12px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--fg3); }
    h1 { margin: 14px 0 0; font-size: clamp(30px, 6vw, 44px); line-height: 1.1; letter-spacing: -0.02em; }
    h1 span { color: var(--acc); }
    p { margin: 16px 0 0; font-size: 18px; line-height: 1.55; color: var(--fg2); }
    a { color: var(--fg); font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div class="k">404</div>
    <h1 id="t">This page doesn't exist<span>.</span></h1>
    <p id="m">There's nothing at this address.</p>
    <p>Taking you to <a href="/">ilialarchenko.com</a> in <b id="s">10</b> seconds.</p>
  </main>
  <script>
    var n = 10, el = document.getElementById('s');
    var timer = setInterval(function () {
      n -= 1; el.textContent = n;
      if (n <= 0) { clearInterval(timer); location.replace('/'); }
    }, 1000);
  </script>
</body>
</html>
